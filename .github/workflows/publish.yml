name: Publish Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact merged release commit or ref to publish. Leave blank only when the selected UI ref already points at that release commit.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Read release plan and enforce publish contract
        id: release
        run: npm run release:plan -- --github-output "$GITHUB_OUTPUT" --write-summary "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Prepare canonical package dependencies
        run: npm run release:prepare:packages

      - name: Run release-focused tests
        run: |
          npx vitest run test/install-converge-seam.test.ts test/brain-core/cold-start-router-contracts.test.ts test/router-migration.test.ts
          node --test packages/cli/dist/test/install-converge.test.js
          node --test packages/cli/dist/test/status-large-log.test.js packages/openclaw/dist/test/status-large-log.test.js
          node --test packages/cli/dist/test/traced-learning-bridge.test.js packages/cli/dist/test/status-learning-path.test.js packages/openclaw/dist/test/traced-learning-bridge.test.js

      - name: Run canonical package tests
        run: |
          npm --prefix packages/openclaw test
          npm --prefix packages/cli test

      - name: Run proof smoke gate
        run: npm run release:verify:proof

      - name: Verify canonical package tarballs
        run: |
          npm run release:verify:openclaw
          npm run release:verify:cli

      - name: Ensure release tag does not already exist
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 1
          fi

      - name: Publish openclaw package to npm
        run: npm publish ./packages/openclaw
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package to npm
        run: npm publish ./packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push release tag
        run: |
          tag="${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          title="${{ steps.release.outputs.title }}"
          notes_file="${{ steps.release.outputs.release_notes_file }}"
          gh release create "$tag" --title "$title" --notes-file "$notes_file" --verify-tag
